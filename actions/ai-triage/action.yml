name: 'AI Security Triage'
description: 'Triage scanner findings via OpenRouter and post a PR comment (optional draft fix PRs)'
author: 'steel-mountain-ng'

inputs:
  findings-dir:
    description: Directory containing downloaded scanner artifacts
    required: false
    default: 'ai-findings'
  repo-root:
    description: Checkout root for code context
    required: false
    default: '.'
  openrouter-api-key:
    description: OpenRouter API key (optional; heuristic triage used when missing)
    required: false
    default: ''
  model:
    description: OpenRouter model id
    required: false
    default: 'openai/gpt-4o-mini'
  max-findings:
    description: Max findings to send to the model
    required: false
    default: '25'
  confidence-threshold:
    description: Minimum confidence for auto-fix eligibility
    required: false
    default: '0.7'
  open-fix-prs:
    description: Open draft fix PRs for allowlisted remediations
    required: false
    default: 'false'
  github-token:
    description: Token for PR comments / draft PRs
    required: false
    default: ${{ github.token }}
  gate-status:
    description: Security Gate result (success/failure/skipped)
    required: false
    default: 'unknown'

outputs:
  comment-path:
    description: Path to rendered markdown comment
    value: ${{ steps.run.outputs.comment-path }}
  triage-json-path:
    description: Path to structured triage JSON
    value: ${{ steps.run.outputs.triage-json-path }}
  fix-pr-urls:
    description: Comma-separated draft fix PR URLs (if any)
    value: ${{ steps.run.outputs.fix-pr-urls }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: python -m pip install --upgrade pip requests

    - name: Run AI triage
      id: run
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        AI_MODEL: ${{ inputs.model }}
        AI_MAX_FINDINGS: ${{ inputs.max-findings }}
        AI_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        AI_OPEN_FIX_PRS: ${{ inputs.open-fix-prs }}
        AI_FINDINGS_DIR: ${{ inputs.findings-dir }}
        AI_REPO_ROOT: ${{ inputs.repo-root }}
        AI_GATE_STATUS: ${{ inputs.gate-status }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python "${{ github.action_path }}/triage.py"
