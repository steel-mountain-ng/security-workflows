name: Reusable Trivy Image

on:
  workflow_call:
    inputs:
      working-directory:
        description: Build context root
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Path to Dockerfile (relative to repo root)
        type: string
        required: false
        default: 'Dockerfile'
      context:
        description: Docker build context
        type: string
        required: false
        default: '.'
      image-name:
        description: Local image name/tag used for the scan
        type: string
        required: false
        default: 'local/app:ci'
      fail-severity:
        description: Minimum severity that fails the job (CRITICAL, HIGH, MEDIUM, LOW)
        type: string
        required: false
        default: 'HIGH'
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image-name }}
          push: false

      - name: Resolve image to scan
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "ref=${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"
            echo "Built image will be scanned: ${{ inputs.image-name }}"
          else
            echo "::warning::Docker build failed; falling back to Dockerfile FROM base image"
            BASE=$(grep -E '^[Ff][Rr][Oo][Mm] ' "${{ inputs.dockerfile }}" | head -n1 | awk '{print $2}' | tr -d '\r')
            if [ -z "$BASE" ]; then
              echo "::error::Could not determine base image from ${{ inputs.dockerfile }}"
              exit 1
            fi
            echo "ref=$BASE" >> "$GITHUB_OUTPUT"
            echo "Base image will be scanned: $BASE"
            docker pull "$BASE"
          fi

      - name: Resolve severity list
        id: severity
        shell: bash
        run: |
          case "${{ inputs.fail-severity }}" in
            CRITICAL) LIST="CRITICAL" ;;
            HIGH) LIST="CRITICAL,HIGH" ;;
            MEDIUM) LIST="CRITICAL,HIGH,MEDIUM" ;;
            LOW) LIST="CRITICAL,HIGH,MEDIUM,LOW" ;;
            *) echo "Unsupported fail-severity: ${{ inputs.fail-severity }}"; exit 1 ;;
          esac
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan (table)
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.target.outputs.ref }}
          severity: ${{ steps.severity.outputs.list }}
          exit-code: '1'
          format: table

      - name: Generate SARIF report
        if: ${{ always() && inputs.upload-sarif }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.target.outputs.ref }}
          severity: ${{ steps.severity.outputs.list }}
          exit-code: '0'
          format: sarif
          output: trivy-image-results.sarif
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Quality gate summary
        if: always()
        shell: bash
        run: |
          echo "### Trivy Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.target.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fail severity: \`${{ inputs.fail-severity }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "- **Gate:** FAILED — CRITICAL/HIGH image vulnerabilities detected (see job log table above)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "- **Gate:** PASSED — no CRITICAL/HIGH image vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Gate:** ${{ steps.scan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
