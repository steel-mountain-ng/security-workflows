name: Reusable RoguePkg Supply Chain

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path containing package.json / lockfiles
        type: string
        required: false
        default: '.'
      malware-only:
        description: Only fail/report malware (recommended for CI)
        type: boolean
        required: false
        default: true
      fail-on-malware:
        description: Fail the workflow when malware is detected
        type: boolean
        required: false
        default: true
      fail-on-vulnerability:
        description: Fail on non-malware vulnerabilities (only when malware-only is false)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  roguepkg:
    name: RoguePkg Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for compromised packages
        id: scan
        uses: radioactivetobi/roguepkg@v1
        with:
          scan-path: ${{ inputs.working-directory }}
          malware-only: ${{ inputs.malware-only }}
          fail-on-malware: ${{ inputs.fail-on-malware }}
          fail-on-vulnerability: ${{ inputs.fail-on-vulnerability }}

      - name: Summarize and stage JSON for AI triage
        if: always()
        shell: bash
        env:
          MALWARE: ${{ steps.scan.outputs.malware-found }}
          VULNS: ${{ steps.scan.outputs.vulnerabilities-found }}
          TOTAL: ${{ steps.scan.outputs.total-scanned }}
          STATUS: ${{ steps.scan.outputs.scan-status }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          mkdir -p findings
          python3 - <<'PY'
          import json, os
          payload = {
            "tool": "roguepkg",
            "malware_found": int(os.environ.get("MALWARE") or 0),
            "vulnerabilities_found": int(os.environ.get("VULNS") or 0),
            "total_scanned": int(os.environ.get("TOTAL") or 0),
            "scan_status": os.environ.get("STATUS") or "unknown",
            "gate_failed": os.environ.get("OUTCOME") == "failure",
          }
          open("findings/roguepkg.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          echo "### RoguePkg results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Malware found: ${MALWARE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vulnerabilities found: ${VULNS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total scanned: ${TOTAL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings-roguepkg
          path: findings/
          if-no-files-found: ignore
          retention-days: 5
