name: Reusable Security CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan
        type: string
        required: false
        default: '.'
      fail-severity:
        description: Minimum severity that fails Trivy jobs (CRITICAL, HIGH, MEDIUM, LOW)
        type: string
        required: false
        default: 'HIGH'
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        type: boolean
        required: false
        default: true
      codeql-languages:
        description: Comma-separated CodeQL languages
        type: string
        required: false
        default: 'javascript'
      codeql-queries:
        description: CodeQL query suite
        type: string
        required: false
        default: 'security-and-quality'
      dockerfile:
        description: Path to Dockerfile
        type: string
        required: false
        default: 'Dockerfile'
      context:
        description: Docker build context
        type: string
        required: false
        default: '.'
      image-name:
        description: Local image name/tag for image scan
        type: string
        required: false
        default: 'local/app:ci'
      run-codeql:
        type: boolean
        required: false
        default: true
      run-trivy-sca:
        type: boolean
        required: false
        default: true
      run-trivy-iac:
        type: boolean
        required: false
        default: true
      run-trivy-secrets:
        type: boolean
        required: false
        default: true
      run-trivy-image:
        type: boolean
        required: false
        default: true
      run-roguepkg:
        type: boolean
        required: false
        default: true
      malware-only:
        type: boolean
        required: false
        default: true
      run-ai-triage:
        description: Run advisory AI triage on pull_request (does not affect Security Gate)
        type: boolean
        required: false
        default: true
      ai-model:
        description: OpenRouter model id
        type: string
        required: false
        default: 'openai/gpt-4o-mini'
      ai-max-findings:
        description: Max findings sent to the model
        type: string
        required: false
        default: '25'
      ai-open-fix-prs:
        description: Open draft fix PRs for allowlisted remediations
        type: boolean
        required: false
        default: false
      run-alert-manager:
        description: Run Code Scanning alert manager (LOW dismiss / AI FP). Prefer schedule/dispatch, not PR CI.
        type: boolean
        required: false
        default: false
      alert-manager-open-fix-prs:
        description: When alert manager runs, open draft fix PRs for allowlisted remediations
        type: boolean
        required: false
        default: false
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter API key for AI triage / alert manager
        required: false

# Nested reusable workflows inherit the *caller* workflow token scope.
# security-events must be granted here or SARIF upload jobs are limited to none.
permissions:
  # contents:write needed when ai-open-fix-prs pushes draft fix branches
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  # Nested reusable workflows cannot use relative ./ paths when the top-level
  # caller is another repository. Call sibling workflows with full refs instead.
  codeql:
    name: CodeQL SAST
    if: ${{ inputs.run-codeql }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-codeql.yml@v1
    with:
      languages: ${{ inputs.codeql-languages }}
      queries: ${{ inputs.codeql-queries }}
      upload-sarif: ${{ inputs.upload-sarif }}
      fail-on-findings: true

  trivy-sca:
    name: Trivy SCA
    if: ${{ inputs.run-trivy-sca }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-trivy-sca.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      fail-severity: ${{ inputs.fail-severity }}
      upload-sarif: ${{ inputs.upload-sarif }}

  trivy-iac:
    name: Trivy IaC
    if: ${{ inputs.run-trivy-iac }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-trivy-iac.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      fail-severity: ${{ inputs.fail-severity }}
      upload-sarif: ${{ inputs.upload-sarif }}

  trivy-secrets:
    name: Trivy Secrets
    if: ${{ inputs.run-trivy-secrets }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-trivy-secrets.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      upload-sarif: ${{ inputs.upload-sarif }}

  trivy-image:
    name: Trivy Image
    if: ${{ inputs.run-trivy-image }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-trivy-image.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image-name: ${{ inputs.image-name }}
      fail-severity: ${{ inputs.fail-severity }}
      upload-sarif: ${{ inputs.upload-sarif }}

  roguepkg:
    name: RoguePkg Supply Chain
    if: ${{ inputs.run-roguepkg }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-roguepkg.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      malware-only: ${{ inputs.malware-only }}
      fail-on-malware: true
      fail-on-vulnerability: false

  security-gate:
    name: Security Gate
    needs:
      - codeql
      - trivy-sca
      - trivy-iac
      - trivy-secrets
      - trivy-image
      - roguepkg
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce no CRITICAL/HIGH, malware, or secrets
        shell: bash
        env:
          CODEQL: ${{ needs.codeql.result }}
          TRIVY_SCA: ${{ needs.trivy-sca.result }}
          TRIVY_IAC: ${{ needs.trivy-iac.result }}
          TRIVY_SECRETS: ${{ needs.trivy-secrets.result }}
          TRIVY_IMAGE: ${{ needs.trivy-image.result }}
          ROGUEPKG: ${{ needs.roguepkg.result }}
          RUN_CODEQL: ${{ inputs.run-codeql }}
          RUN_TRIVY_SCA: ${{ inputs.run-trivy-sca }}
          RUN_TRIVY_IAC: ${{ inputs.run-trivy-iac }}
          RUN_TRIVY_SECRETS: ${{ inputs.run-trivy-secrets }}
          RUN_TRIVY_IMAGE: ${{ inputs.run-trivy-image }}
          RUN_ROGUEPKG: ${{ inputs.run-roguepkg }}
        run: |
          set -euo pipefail
          echo "### Security Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Enabled | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | $RUN_CODEQL | $CODEQL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy SCA | $RUN_TRIVY_SCA | $TRIVY_SCA |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy IaC | $RUN_TRIVY_IAC | $TRIVY_IAC |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Secrets | $RUN_TRIVY_SECRETS | $TRIVY_SECRETS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Image | $RUN_TRIVY_IMAGE | $TRIVY_IMAGE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RoguePkg | $RUN_ROGUEPKG | $ROGUEPKG |" >> "$GITHUB_STEP_SUMMARY"

          failed=0
          check() {
            local enabled="$1"
            local result="$2"
            local label="$3"
            if [ "$enabled" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::Quality gate failed: $label result=$result"
                failed=1
              fi
            fi
          }

          check "$RUN_CODEQL" "$CODEQL" "CodeQL SAST"
          check "$RUN_TRIVY_SCA" "$TRIVY_SCA" "Trivy SCA"
          check "$RUN_TRIVY_IAC" "$TRIVY_IAC" "Trivy IaC"
          check "$RUN_TRIVY_SECRETS" "$TRIVY_SECRETS" "Trivy Secrets"
          check "$RUN_TRIVY_IMAGE" "$TRIVY_IMAGE" "Trivy Image"
          check "$RUN_ROGUEPKG" "$ROGUEPKG" "RoguePkg"

          if [ "$failed" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Gate result:** FAILED — CRITICAL/HIGH findings, secrets, or malware blocked promotion." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gate result:** PASSED" >> "$GITHUB_STEP_SUMMARY"

  # Advisory only. Never included in Security Gate. Does not change pass/fail.
  ai-triage:
    name: AI Triage
    needs:
      - codeql
      - trivy-sca
      - trivy-iac
      - trivy-secrets
      - trivy-image
      - roguepkg
      - security-gate
    if: ${{ always() && inputs.run-ai-triage && github.event_name == 'pull_request' }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-ai-triage.yml@v1
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      model: ${{ inputs.ai-model }}
      max-findings: ${{ inputs.ai-max-findings }}
      open-fix-prs: ${{ inputs.ai-open-fix-prs }}
      gate-status: ${{ needs.security-gate.result }}

  # Backlog hygiene for Code Scanning alerts. Default off in PR CI.
  alert-manager:
    name: Alert Manager
    needs:
      - security-gate
    if: ${{ always() && inputs.run-alert-manager }}
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-alert-manager.yml@v1
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      dismiss-lows: true
      ai-review: true
      open-fix-prs: ${{ inputs.alert-manager-open-fix-prs }}
      model: ${{ inputs.ai-model }}
