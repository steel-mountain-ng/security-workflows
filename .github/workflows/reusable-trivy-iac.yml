name: Reusable Trivy IaC

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan (Dockerfile, K8s, Terraform, etc.)
        type: string
        required: false
        default: '.'
      fail-severity:
        description: Minimum severity that fails the job (CRITICAL, HIGH, MEDIUM, LOW)
        type: string
        required: false
        default: 'HIGH'
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  trivy-iac:
    name: Trivy IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve severity list
        id: severity
        shell: bash
        run: |
          case "${{ inputs.fail-severity }}" in
            CRITICAL) LIST="CRITICAL" ;;
            HIGH) LIST="CRITICAL,HIGH" ;;
            MEDIUM) LIST="CRITICAL,HIGH,MEDIUM" ;;
            LOW) LIST="CRITICAL,HIGH,MEDIUM,LOW" ;;
            *) echo "Unsupported fail-severity: ${{ inputs.fail-severity }}"; exit 1 ;;
          esac
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Run Trivy IaC scan (table)
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: ${{ steps.severity.outputs.list }}
          exit-code: '1'
          format: table

      - name: Prepare findings directory
        if: always()
        run: mkdir -p findings

      - name: Generate JSON report for AI triage
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: ${{ steps.severity.outputs.list }}
          exit-code: '0'
          format: json
          output: findings/trivy-iac.json

      - name: Generate SARIF report
        if: ${{ always() && inputs.upload-sarif }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: ${{ steps.severity.outputs.list }}
          exit-code: '0'
          format: sarif
          output: findings/trivy-iac.sarif
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: findings/trivy-iac.sarif
          category: trivy-iac

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings-trivy-iac
          path: findings/
          if-no-files-found: ignore
          retention-days: 5

      - name: Quality gate summary
        if: always()
        shell: bash
        run: |
          echo "### Trivy IaC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fail severity: \`${{ inputs.fail-severity }}\` (scans \`${{ steps.severity.outputs.list }}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "- **Gate:** FAILED — CRITICAL/HIGH misconfigurations detected (see job log table above)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "- **Gate:** PASSED — no CRITICAL/HIGH misconfigurations." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Gate:** ${{ steps.scan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
