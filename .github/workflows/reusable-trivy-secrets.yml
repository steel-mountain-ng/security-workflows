name: Reusable Trivy Secrets

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for secrets
        type: string
        required: false
        default: '.'
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  trivy-secrets:
    name: Trivy Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: secret
          scan-ref: ${{ inputs.working-directory }}
          exit-code: '1'
          format: sarif
          output: trivy-secrets-results.sarif

      - name: Upload SARIF
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets-results.sarif
          category: trivy-secrets
