name: Reusable Trivy Secrets

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for secrets
        type: string
        required: false
        default: '.'
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  trivy-secrets:
    name: Trivy Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Modern Trivy removed `trivy secret`; use filesystem scan + secret scanner.
      - name: Run Trivy secret scan (table)
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: secret
          exit-code: '1'
          format: table

      - name: Generate SARIF report
        if: ${{ always() && inputs.upload-sarif }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: secret
          exit-code: '0'
          format: sarif
          output: trivy-secrets-results.sarif

      - name: Upload SARIF
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets-results.sarif
          category: trivy-secrets

      - name: Quality gate summary
        if: always()
        shell: bash
        run: |
          echo "### Trivy Secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "**Gate:** FAILED — hardcoded secrets detected (see job log table above)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "**Gate:** PASSED — no secrets detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Gate:** ${{ steps.scan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
