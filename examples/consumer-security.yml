# Copy to your app repo as .github/workflows/security.yml
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  security:
    name: Security CI
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-security-ci.yml@v1
    secrets: inherit
    with:
      fail-severity: HIGH
      upload-sarif: true
      codeql-languages: javascript
      dockerfile: Dockerfile
      context: .
      image-name: local/${{ github.event.repository.name }}:ci
      run-ai-triage: true
      ai-model: openai/gpt-4o-mini
      ai-max-findings: '25'
      # Draft fix PRs for allowlisted items only (Dockerfile USER, dep bumps, base image)
      ai-open-fix-prs: false
      # Prefer dedicated alert-manager.yml schedule/dispatch for LOW dismiss
      run-alert-manager: false
